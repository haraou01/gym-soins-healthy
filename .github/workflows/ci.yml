name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build backend, frontend & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymsoins
          POSTGRES_PASSWORD: gymsoins
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gymsoins -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/src-frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client/src-frontend
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        working-directory: client/src-frontend
        run: npm run build

      - name: Audit secrets
        run: npm run audit:secrets

      - name: Validate observability assets
        run: npm run validate:ops

      - name: Unit tests (no database)
        env:
          NODE_ENV: test
        run: npm run test:unit

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Migration test — blank database
        env:
          PGPASSWORD: gymsoins
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 55432
          POSTGRES_USERNAME: gymsoins
          POSTGRES_PASSWORD: gymsoins
          POSTGRES_DATABASE: gymsoins_migration_blank
          ALLOW_LEGACY_TEST_DB: 'true'
        run: |
          node scripts/ci-db-guard.js gymsoins_migration_blank destructive
          psql -h 127.0.0.1 -p 55432 -U gymsoins -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS gymsoins_migration_blank;' \
            -c 'CREATE DATABASE gymsoins_migration_blank;'
          npm run db:migrate
          npm run db:migrate
          EXPECTED="$(find src/database/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          COUNT="$(psql -h 127.0.0.1 -p 55432 -U gymsoins -d gymsoins_migration_blank -tAc 'SELECT COUNT(*) FROM schema_migrations;')"
          test "$COUNT" = "$EXPECTED"

      - name: Run E2E tests
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_PORT: 55432
          TEST_PG_USER: gymsoins
          TEST_PG_PASSWORD: gymsoins
          TEST_PG_DATABASE: gymsoins_ci
          ALLOW_LEGACY_TEST_DB: 'true'
          # Rôles de test uniquement, base éphémère CI ; jamais staging/production.
          TEST_RESET_RUNTIME_ROLES: 'true'
        run: npx jest --config ./test/jest-e2e.json --runInBand

      - name: Verify OpenTelemetry OTLP export
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 55432
          POSTGRES_USERNAME: gymsoins
          POSTGRES_PASSWORD: gymsoins
          POSTGRES_DATABASE: gymsoins_ci
          APP_DB_USER: gymsoins_app
          APP_DB_PASSWORD: e2e-app-runtime-password-2026
          WORKER_DB_USER: gymsoins_worker
          WORKER_DB_PASSWORD: e2e-worker-runtime-password-2026
          ALLOW_LEGACY_TEST_DB: 'true'
        run: npm run verify:otel

      - name: Retention worker smoke
        env:
          NODE_ENV: test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 55432
          POSTGRES_USERNAME: gymsoins
          POSTGRES_PASSWORD: gymsoins
          POSTGRES_DATABASE: gymsoins_ci
          JWT_SECRET: ci-jwt-secret-change-me
          LICENSE_DEV_MODE: true
          OUTBOX_WORKER_ENABLED: false
          RETENTION_PURGE_ENABLED: true
          RETENTION_PURGE_INTERVAL_MS: 1000
          RETENTION_WORKER_HEALTH_PORT: 3103
          RETENTION_DB_USER: gymsoins_retention
          RETENTION_DB_PASSWORD: e2e-retention-runtime-password-2026
        run: |
          node dist/retention-worker.js > /tmp/retention-ci.log 2>&1 &
          echo $! > /tmp/retention-ci.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3103/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3103/health
          curl -sf http://127.0.0.1:3103/metrics | grep 'retention_worker_up 1'
          kill -TERM "$(cat /tmp/retention-ci.pid)"
          wait "$(cat /tmp/retention-ci.pid)" || true

      - name: KDS SSE tenant isolation smoke
        env:
          NODE_ENV: test
          PORT: 3105
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 55432
          POSTGRES_USERNAME: gymsoins
          POSTGRES_PASSWORD: gymsoins
          POSTGRES_DATABASE: gymsoins_ci
          JWT_SECRET: ci-jwt-secret-change-me
          LICENSE_DEV_MODE: true
          OUTBOX_WORKER_ENABLED: false
          OUTBOX_POLL_INTERVAL_MS: 500
          RETENTION_PURGE_ENABLED: false
          THROTTLE_LIMIT: 100000
          POSTGRES_RUNTIME_USERNAME: gymsoins_app
          POSTGRES_RUNTIME_PASSWORD: e2e-app-runtime-password-2026
          SSE_VERIFY_BASE_URL: http://127.0.0.1:3105/api/v1
          RLS_SMOKE_BASE_URL: http://127.0.0.1:3105/api/v1
          ALLOW_LEGACY_TEST_DB: 'true'
        run: |
          node dist/main.js > /tmp/kds-sse-ci.log 2>&1 &
          echo $! > /tmp/kds-sse-ci.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3105/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run verify:kds-sse
          npm run verify:app-rls
          kill -TERM "$(cat /tmp/kds-sse-ci.pid)"
          wait "$(cat /tmp/kds-sse-ci.pid)" || true

      - name: Dependency audit — high production gate
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          npm audit --omit=dev --audit-level=high

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
