name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build backend, frontend & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymsoins
          POSTGRES_PASSWORD: gymsoins
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gymsoins -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/src-frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client/src-frontend
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        working-directory: client/src-frontend
        run: npm run build

      - name: Audit secrets
        run: npm run audit:secrets

      - name: Run E2E tests
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_PORT: 55432
          TEST_PG_USER: gymsoins
          TEST_PG_PASSWORD: gymsoins
          TEST_PG_DATABASE: gymsoins_ci
        run: npx jest --config ./test/jest-e2e.json --runInBand
