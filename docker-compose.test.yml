services:
  postgres-test:
    image: postgres:16-alpine
    container_name: gymsoins-postgres-test
    environment:
      POSTGRES_USER: gymsoins
      POSTGRES_PASSWORD: gymsoins
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymsoins -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
