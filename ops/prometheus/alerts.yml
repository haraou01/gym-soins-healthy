groups:
  - name: gymsoins-api
    rules:
      - alert: GymSoinsApiServerErrorRate
        expr: |
          (
            sum(rate(http_errors_total{type="server"}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: critical
          service: gymsoins-api
        annotations:
          summary: "Taux 5xx API supérieur à 2 %"
          description: "Le taux d'erreurs serveur dépasse 2 % sur 5 minutes."
          action: "Vérifier les logs requestId/traceId, les spans OTel et les erreurs PG/Outbox. Rollback si le déploiement est corrélé."

      - alert: GymSoinsApiP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_ms_bucket[5m]))
          ) > 1000
        for: 10m
        labels:
          severity: warning
          service: gymsoins-api
        annotations:
          summary: "Latence p95 API supérieure à 1 s"
          description: "La p95 HTTP dépasse 1 seconde pendant 10 minutes."
          action: "Comparer avec db_connections, db_locks, outbox_events et le trafic réel. Ne pas optimiser sans mesure."

  - name: gymsoins-database
    rules:
      - alert: GymSoinsDatabaseSaturation
        expr: |
          db_connections / clamp_min(db_max_connections, 1) > 0.80
        for: 10m
        labels:
          severity: warning
          service: gymsoins-postgresql
        annotations:
          summary: "Connexions PostgreSQL supérieures à 80 %"
          description: "Le pool/les sessions approchent max_connections."
          action: "Vérifier les fuites de connexions, le pool TypeORM et les workers. Réduire la concurrence si nécessaire."

      - alert: GymSoinsDatabaseWaitingLocks
        expr: db_locks{state="waiting"} > 5
        for: 5m
        labels:
          severity: warning
          service: gymsoins-postgresql
        annotations:
          summary: "Locks PostgreSQL en attente"
          description: "Plus de 5 locks sont en attente pendant 5 minutes."
          action: "Identifier les transactions bloquantes avec pg_stat_activity/pg_locks, vérifier les contraintes d'exclusion Booking et les transactions longues."

      - alert: GymSoinsDatabaseMetricsUnavailable
        expr: absent(db_connections)
        for: 5m
        labels:
          severity: critical
          service: gymsoins-api
        annotations:
          summary: "Métriques PostgreSQL indisponibles"
          description: "L'API n'expose plus db_connections."
          action: "Vérifier /ready, la connectivité PostgreSQL et l'endpoint metrics."

  - name: gymsoins-outbox
    rules:
      - alert: GymSoinsOutboxFailed
        expr: max(outbox_events{status="FAILED"}) > 0
        for: 1m
        labels:
          severity: critical
          service: gymsoins-outbox
        annotations:
          summary: "Événements Outbox FAILED"
          description: "Au moins un événement Outbox est en échec définitif."
          action: "Consulter lastError, corriger le listener, puis requeue via l'endpoint admin Outbox. Ne jamais supprimer un FAILED."

      - alert: GymSoinsOutboxBacklog
        expr: max(outbox_events{status="PENDING"}) > 100
        for: 10m
        labels:
          severity: warning
          service: gymsoins-outbox
        annotations:
          summary: "Backlog Outbox PENDING"
          description: "Plus de 100 événements PENDING depuis 10 minutes."
          action: "Vérifier le worker (heartbeat), la latence DB, le taux de retry et le volume d'événements."

      - alert: GymSoinsOutboxProcessingStuck
        expr: max(outbox_events{status="PROCESSING"}) > 0
        for: 10m
        labels:
          severity: warning
          service: gymsoins-outbox
        annotations:
          summary: "Événements Outbox PROCESSING bloqués"
          description: "Des événements restent PROCESSING au-delà du timeout de lock."
          action: "Vérifier le worker et la recovery stale. Un redémarrage worker doit reprendre les PROCESSING expirés."

      - alert: GymSoinsOutboxRetriesHigh
        expr: sum(rate(outbox_events_retried_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: gymsoins-outbox
        annotations:
          summary: "Taux de retry Outbox élevé"
          description: "Les retries dépassent 0,1/s sur 10 minutes."
          action: "Identifier eventType en échec, vérifier les dépendances listener et la connectivité DB."

      - alert: GymSoinsOutboxWorkerDown
        expr: absent(outbox_worker_up{job="gymsoins-outbox-worker"}) or max by (job) (outbox_worker_up{job="gymsoins-outbox-worker"}) == 0
        for: 2m
        labels:
          severity: critical
          service: gymsoins-outbox-worker
        annotations:
          summary: "Worker Outbox absent"
          description: "Le worker Outbox n'est plus scrapeable ou est arrêté."
          action: "Démarrer/redémarrer le worker dédié, vérifier /health et /ready, puis surveiller le backlog."

      - alert: GymSoinsOutboxWorkerScrapeDown
        expr: absent(up{job="gymsoins-outbox-worker"}) or up{job="gymsoins-outbox-worker"} == 0
        for: 1m
        labels:
          severity: critical
          service: gymsoins-outbox-worker
        annotations:
          summary: "Cible Prometheus worker Outbox absente ou DOWN"
          description: "Le job gymsoins-outbox-worker n'est plus collecté ou sa cible est DOWN."
          action: "Vérifier le processus worker, le port /metrics, la configuration Prometheus et les logs de scrape."

      - alert: GymSoinsOutboxWorkerHeartbeatStale
        expr: time() - max(outbox_worker_heartbeat_timestamp_seconds{job="gymsoins-outbox-worker"}) > 30
        for: 2m
        labels:
          severity: critical
          service: gymsoins-outbox-worker
        annotations:
          summary: "Heartbeat worker Outbox obsolète"
          description: "Aucun tick worker depuis plus de 30 secondes."
          action: "Vérifier le processus, DB et logs worker. Le worker doit redémarrer avec grâce et reprendre les événements."

  - name: gymsoins-retention
    rules:
      - alert: GymSoinsRetentionWorkerDown
        expr: absent(retention_worker_up{job="gymsoins-retention-worker"}) or max by (job) (retention_worker_up{job="gymsoins-retention-worker"}) == 0
        for: 30m
        labels:
          severity: warning
          service: gymsoins-retention-worker
        annotations:
          summary: "Worker rétention absent"
          description: "Le worker de rétention n'est pas actif."
          action: "Démarrer le worker dédié, vérifier le verrou advisory et /health."

      - alert: GymSoinsRetentionWorkerScrapeDown
        expr: absent(up{job="gymsoins-retention-worker"}) or up{job="gymsoins-retention-worker"} == 0
        for: 2m
        labels:
          severity: critical
          service: gymsoins-retention-worker
        annotations:
          summary: "Cible Prometheus worker rétention absente ou DOWN"
          description: "Le job gymsoins-retention-worker n'est plus collecté ou sa cible est DOWN."
          action: "Vérifier le processus rétention, le port /metrics, la configuration Prometheus et les logs de scrape."

      - alert: GymSoinsRetentionErrors
        expr: increase(retention_purge_errors_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          service: gymsoins-retention-worker
        annotations:
          summary: "Erreurs de purge rétention"
          description: "Au moins une purge a échoué sur l'heure."
          action: "Consulter les logs retention, vérifier les locks PostgreSQL et les requêtes de purge."

      - alert: GymSoinsRetentionStale
        expr: time() - max(retention_last_success_timestamp_seconds{job="gymsoins-retention-worker"}) > 129600
        for: 30m
        labels:
          severity: warning
          service: gymsoins-retention-worker
        annotations:
          summary: "Rétention sans succès depuis 36 h"
          description: "La dernière purge réussie date de plus de 36 heures."
          action: "Vérifier le worker, le verrou advisory et la configuration RETENTION_PURGE_INTERVAL_MS."

  - name: gymsoins-kds
    rules:
      - alert: GymSoinsKdsSseReconnectSpike
        expr: increase(kds_sse_disconnects_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: gymsoins-kds
        annotations:
          summary: "Reconnexions SSE KDS anormales"
          description: "Plus de 10 déconnexions SSE en 5 minutes."
          action: "Vérifier le réseau, les timeouts proxy, les tickets expirés et les logs SSE. Le fallback polling doit rester actif."

      - alert: GymSoinsKdsPollErrors
        expr: increase(kds_poll_errors_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
          service: gymsoins-kds
        annotations:
          summary: "Erreurs de polling Outbox KDS"
          description: "Le service SSE ne parvient plus à lire les événements Outbox."
          action: "Vérifier la connectivité PostgreSQL et la table outbox_events. Le REST KDS reste la source de vérité."

  - name: gymsoins-auth
    rules:
      - alert: GymSoinsLoginFailureSpike
        expr: |
          sum(rate(auth_events_total{action="LOGIN",success="false"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: gymsoins-auth
        annotations:
          summary: "Pic d'échecs de connexion"
          description: "Plus d'un échec de login par seconde en moyenne sur 10 minutes."
          action: "Analyser IP/email dans security_audit_logs, vérifier le rate limiting et le lockout. Ne pas bloquer sans preuve."

      - alert: GymSoinsAccountLockSpike
        expr: increase(auth_account_locked_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          service: gymsoins-auth
        annotations:
          summary: "Verrouillages de comptes"
          description: "Plus de 5 comptes verrouillés en 10 minutes."
          action: "Vérifier les attaques ou un problème client. Contrôler les audits LOGIN."

  - name: gymsoins-backup
    rules:
      - alert: GymSoinsBackupStale
        expr: time() - gymsoins_backup_last_success_timestamp_seconds > 129600
        for: 30m
        labels:
          severity: critical
          service: gymsoins-backup
        annotations:
          summary: "Backup absent depuis 36 h"
          description: "Le dernier backup réussi date de plus de 36 heures."
          action: "Vérifier le workflow backup-restore, les credentials PostgreSQL et l'espace disque. Ne pas attendre le prochain cycle."

      - alert: GymSoinsBackupMetricsMissing
        expr: absent(gymsoins_backup_last_success_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
          service: gymsoins-backup
        annotations:
          summary: "Métriques backup absentes"
          description: "Aucun timestamp backup n'est exposé."
          action: "Vérifier BACKUP_METRICS_FILE et le textfile collector node_exporter."

      - alert: GymSoinsRestoreVerificationStale
        expr: time() - gymsoins_restore_last_success_timestamp_seconds > 129600
        for: 30m
        labels:
          severity: critical
          service: gymsoins-backup
        annotations:
          summary: "Vérification restore absente depuis 36 h"
          description: "La dernière vérification de restauration réussie date de plus de 36 heures."
          action: "Exécuter le workflow restore isolé, vérifier les migrations et le smoke test."

      - alert: GymSoinsRestoreVerificationFailed
        expr: gymsoins_restore_last_mismatches > 0
        for: 1m
        labels:
          severity: critical
          service: gymsoins-backup
        annotations:
          summary: "Mismatches de restauration"
          description: "La vérification restore détecte des différences."
          action: "Ne pas promouvoir le backup. Analyser les tables en écart et relancer une sauvegarde propre."
