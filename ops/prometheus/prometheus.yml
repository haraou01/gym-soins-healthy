global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gymsoins-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/gymsoins_metrics_token
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: gymsoins-api
          environment: production

  - job_name: gymsoins-outbox-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-worker:3002"]
        labels:
          service: gymsoins-outbox-worker
          environment: production

  - job_name: gymsoins-retention-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["retention-worker:3003"]
        labels:
          service: gymsoins-retention-worker
          environment: production

  # Optionnel : node_exporter avec textfile collector pour les métriques
  # backup/restore écrites par BACKUP_METRICS_FILE / RESTORE_METRICS_FILE.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: gymsoins-host
