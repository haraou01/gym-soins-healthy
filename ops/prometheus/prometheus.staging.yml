global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts.staging-test.yml

scrape_configs:
  - job_name: gymsoins-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/gymsoins_metrics_token
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: gymsoins-api
          environment: staging-local
          instance: local-api

  - job_name: gymsoins-outbox-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3102"]
        labels:
          service: gymsoins-outbox-worker
          environment: staging-local
          instance: local-worker

  - job_name: gymsoins-retention-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3103"]
        labels:
          service: gymsoins-retention-worker
          environment: staging-local
          instance: local-retention
